---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {%- if page.last_modified_at -%}
  <hr />
  <p style="font-size: small;">Last modified: {{ page.last_modified_at }}</p>
  {%- endif -%}

</article>
